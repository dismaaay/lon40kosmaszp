<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figury geometryczne</title>
    <link href="stylefig.css" rel="stylesheet" type="text/css" />
    <script src="funkcje.js" defer></script>
      <script src="guard.js" defer></script>
</head>

  <body>
    <div id="container">
      <h1>Figury geometryczne</h1>
      <p class="opis">Podaj wartości i kliknij „Oblicz”.</p>

      <div id="fig1">
        <fieldset class="karta">
          <legend>Prostokąt</legend>

          <label for="pr_a">Bok a</label>
          <input type="number" id="pr_a" step="any" />

          <label for="pr_b">Bok b</label>
          <input type="number" id="pr_b" step="any" />

          <input type="button" value="Oblicz" onclick="obliczPr()" />

          <p id="p_polePr" class="wynik"></p>
          <p id="p_obwPr" class="wynik"></p>
        </fieldset>

        <fieldset class="karta">
          <legend>Trójkąt</legend>

          <label for="tr_a">Bok a</label>
          <input type="number" id="tr_a" step="any" />

          <label for="tr_b">Bok b</label>
          <input type="number" id="tr_b" step="any" />

          <label for="tr_c">Bok c</label>
          <input type="number" id="tr_c" step="any" />

          <label for="tr_h">Wysokość h</label>
          <input type="number" id="tr_h" step="any" />

          <input type="button" value="Oblicz" onclick="obliczTrojkat()" />

          <p id="p_poleTr" class="wynik"></p>
          <p id="p_obwTr" class="wynik"></p>
        </fieldset>

        <fieldset class="karta">
          <legend>Koło</legend>

          <label for="k_r">Promień r</label>
          <input type="number" id="k_r" step="any" />

          <input type="button" value="Oblicz" onclick="obliczKolo()" />

          <p id="p_poleK" class="wynik"></p>
          <p id="p_obwK" class="wynik"></p>
        </fieldset>

        <fieldset class="karta">
          <legend>Trapez</legend>

          <label for="t_a">Podstawa a</label>
          <input type="number" id="t_a" step="any" />

          <label for="t_b">Podstawa b</label>
          <input type="number" id="t_b" step="any" />

          <label for="t_c">Bok c</label>
          <input type="number" id="t_c" step="any" />

          <label for="t_d">Bok d</label>
          <input type="number" id="t_d" step="any" />

          <label for="t_h">Wysokość h</label>
          <input type="number" id="t_h" step="any" />

          <input type="button" value="Oblicz" onclick="obliczTrapez()" />

          <p id="p_poleT" class="wynik"></p>
          <p id="p_obwT" class="wynik"></p>
        </fieldset>
      </div>
    </div>
  </body>
</html>
